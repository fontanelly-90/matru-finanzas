<title>Finanzas MATRU Cacao</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" />
<style>
  :root{
    color-scheme: light only;
    --bg:#F2ECDF; --card:#FBF8F1; --border:#E4D7BE; --ink:#2E1B12; --ink2:#3B2113;
    --muted:#9C8258; --brown2:#8A5A2B; --green:#4B6A4B; --blue:#5B7A9E;
    --purple:#8A6BAE; --tan:#B5763E; --amber:#C17A3D; --err-bg:#F3DCC9; --err-ink:#7A3B1E;
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Fraunces',serif;}
  .wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px;background:var(--bg);min-height:100vh;}
  header{margin-bottom:24px;background:var(--bg);}
  .eyebrow{display:flex;align-items:center;gap:8px;color:var(--brown2);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;margin-bottom:4px;}
  h1{font-size:28px;font-weight:600;color:var(--ink2);margin:0;}
  .saving{font-size:11px;color:var(--brown2);}
  .grid-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  @media(min-width:520px){.grid-summary{grid-template-columns:repeat(3,1fr);}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;}
  .card .label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin-bottom:6px;}
  .card .value{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--ink);}
  .card .sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:20px;}
  .panel h2{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:0 0 4px;color:var(--ink2);}
  .panel p.hint{font-size:12px;color:var(--brown2);margin:0 0 14px;}
  .panel-head{display:flex;justify-content:space-between;align-items:flex-start;}
  .gear{background:var(--bg);border:none;border-radius:8px;padding:6px;cursor:pointer;}
  .slider-row{margin-bottom:12px;}
  .slider-row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
  .slider-row .top .pct{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  input[type=range]{width:100%;accent-color:#C17A3D;}
  .divider-row{display:flex;justify-content:space-between;font-size:13px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .tabs{display:flex;gap:8px;margin-bottom:14px;}
  .tab-btn{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--card);color:var(--brown2);cursor:pointer;}
  .tab-btn.active{background:var(--ink2);color:var(--bg);border-color:var(--ink2);}
  form.panel{margin-bottom:24px;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  label.field{display:block;}
  label.field span.lbl{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-bottom:4px;}
  .field-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 10px;}
  .field-box input{width:100%;background:var(--bg);border:none;outline:none;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink);color-scheme:light;}
  .money-box{display:flex;align-items:center;gap:4px;}
  .money-box .cur{font-size:12px;color:var(--muted);}
  .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .cat-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:10px;font-size:11px;line-height:1.2;text-align:center;border:1px solid var(--border);background:var(--bg);color:var(--brown2);cursor:pointer;}
  .cat-btn.active{background:var(--ink2);color:var(--bg);}
  .info-box{font-size:12px;color:var(--brown2);background:var(--bg);border-radius:10px;padding:9px 12px;margin-bottom:14px;}
  .info-box strong{color:var(--ink2);}
  .warn{color:var(--err-ink);}
  button.submit{width:100%;padding:11px;border:none;border-radius:10px;background:var(--ink2);color:var(--bg);font-size:14px;font-weight:500;cursor:pointer;}
  .preview{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .preview-row{background:var(--bg);border-radius:10px;padding:8px 10px;}
  .preview-row .plabel{font-size:11px;color:var(--muted);}
  .preview-row .pvalue{font-family:'IBM Plex Mono',monospace;font-size:13px;margin-top:2px;}
  .error-banner{background:var(--err-bg);color:var(--err-ink);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px;}
  .history h2{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:0 0 10px;color:var(--ink2);}
  .hist-item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .hist-item .top-row{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
  .hist-item .date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .hist-item .amt{font-size:13px;font-weight:600;}
  .hist-item .detail{font-size:11px;color:var(--brown2);display:flex;flex-wrap:wrap;gap:8px;}
  .del-btn{border:none;background:transparent;cursor:pointer;opacity:.6;padding:6px;border-radius:8px;}
  .del-btn:hover{opacity:1;}
  .icon{width:14px;height:14px;display:inline-block;vertical-align:middle;}
  .empty-hint{font-size:12px;color:var(--muted);text-align:center;padding:20px 0;}
</style>
</head>
<body>
<div id="lockScreen" style="position:fixed;inset:0;background:#3B2113;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:999;">
  <div style="font-size:15px;color:#F2ECDF;margin-bottom:14px;font-family:'IBM Plex Sans',sans-serif;">Código de acceso</div>
  <input type="password" id="lockInput" inputmode="numeric" placeholder="••••" autocomplete="off"
    style="font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:6px;text-align:center;width:160px;padding:10px;border-radius:10px;border:1px solid #8A5A2B;background:#F2ECDF;color:#2E1B12;" />
  <button id="lockBtn" style="margin-top:14px;padding:10px 28px;border:none;border-radius:10px;background:#C17A3D;color:#3B2113;font-weight:600;font-size:14px;">Entrar</button>
  <div id="lockError" style="color:#E4A28C;font-size:12px;margin-top:10px;height:14px;"></div>
</div>

    <div class="panel-head">
      <h2>Cómo se reparte cada venta</h2>
      <button class="gear" id="gearBtn" title="Ajustar precio de Reinversión">⚙️</button>
    </div>
    <p class="hint" id="repartoHint"></p>
    <div id="ajustesBox" style="display:none;margin-bottom:14px;font-size:13px;">
      Precio Reinversión ($/kg):
      <input type="number" id="precioReinversion" min="1" step="1" style="width:70px;margin-left:6px;padding:5px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);font-family:'IBM Plex Mono',monospace;" />
    </div>
    <div id="sliders"></div>
    <div class="divider-row">
      <span>Tu ganancia</span>
      <span class="mono" id="pctGananciaLabel" style="font-weight:600;color:var(--amber);"></span>
    </div>
  </section>

  <div class="tabs">
    <button class="tab-btn active" id="tabVentaBtn">↑ Ingresar venta</button>
    <button class="tab-btn" id="tabGastoBtn">↓ Ingresar gasto</button>
  </div>

  <form class="panel" id="ventaForm">
    <div class="field-grid">
      <label class="field"><span class="lbl">Fecha</span>
        <div class="field-box"><input type="date" id="ventaFecha" /></div>
      </label>
      <label class="field"><span class="lbl">Monto de la venta</span>
        <div class="field-box money-box"><span class="cur">$</span><input type="number" id="ventaMonto" step="0.01" min="0" placeholder="0.00" /></div>
      </label>
    </div>
    <div class="preview" id="ventaPreview" style="display:none;"></div>
    <button type="submit" class="submit">Guardar venta</button>
  </form>

  <form class="panel" id="gastoForm" style="display:none;">
    <div class="field-grid">
      <label class="field"><span class="lbl">Fecha</span>
        <div class="field-box"><input type="date" id="gastoFecha" /></div>
      </label>
      <label class="field"><span class="lbl">Monto del gasto</span>
        <div class="field-box money-box"><span class="cur">$</span><input type="number" id="gastoMonto" step="0.01" min="0" placeholder="0.00" /></div>
      </label>
    </div>
    <p style="font-size:11px;color:var(--muted);margin:0 0 8px;">Categoría</p>
    <div class="cats" id="gastoCats"></div>
    <div class="info-box" id="gastoInfo"></div>
    <button type="submit" class="submit">Guardar gasto</button>
  </form>

  <section class="history">
    <h2>Historial</h2>
    <div id="historyList"></div>
  </section>
</div>

<script>
const STORAGE_KEY = "matru-finanzas-local";
const PRECIO_GESTION = 200;
const GASTO_CATS = [
  { id: "envio", label: "Envío", icon: "🚚", bucket: "gastosVar" },
  { id: "cajas", label: "Cajas", icon: "📦", bucket: "gastosVar" },
  { id: "gasolina", label: "Gasolina", icon: "⛽", bucket: "gastosVar" },
  { id: "otros", label: "Otros", icon: "⋯", bucket: "gastosVar" },
  { id: "nomina", label: "Nómina", icon: "👥", bucket: "nomina" },
  { id: "reinversion", label: "Reinversión", icon: "🏬", bucket: "reinversion" },
  { id: "gestion", label: "Gestión CC", icon: "🌱", bucket: "gestion" },
  { id: "ganancia", label: "Ganancia", icon: "💰", bucket: "ganancia" },
];

function emptyState() {
  return {
    entries: [],
    gestionMonto: 0, gestionKg: 0,
    reinversionMonto: 0, reinversionKg: 0,
    saldoNomina: 0, saldoGastosVar: 0, saldoGanancia: 0,
    pct: { gestion: 30, reinversion: 10, nomina: 20, gastosVar: 15 },
    precioReinversion: 55,
  };
}

let data = load();
let tab = "venta";
let gastoCategoria = "envio";
let error = null;

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return { ...emptyState(), ...JSON.parse(raw) };
  } catch (e) {}
  return emptyState();
}

function save() {
  const tag = document.getElementById("savingTag");
  tag.style.display = "inline";
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    error = "No se pudo guardar en este dispositivo.";
  }
  setTimeout(() => (tag.style.display = "none"), 400);
}

function mxn(n) {
  return (n || 0).toLocaleString("es-MX", { style: "currency", currency: "MXN", maximumFractionDigits: 2 });
}

function pctGanancia() {
  return 100 - data.pct.gestion - data.pct.reinversion - data.pct.nomina - data.pct.gastosVar;
}

function bucketBalance(bucket) {
  switch (bucket) {
    case "gastosVar": return data.saldoGastosVar;
    case "nomina": return data.saldoNomina;
    case "ganancia": return data.saldoGanancia;
    case "reinversion": return data.reinversionMonto;
    case "gestion": return data.gestionMonto;
    default: return 0;
  }
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

/* ---------- render ---------- */

function renderSummary() {
  const ingresos = data.entries.filter(e => e.type === "venta").reduce((a, e) => a + e.monto, 0);
  const gastos = data.entries.filter(e => e.type === "gasto").reduce((a, e) => a + e.monto, 0);
  const nVentas = data.entries.filter(e => e.type === "venta").length;
  const cards = [
    { label: "Ingresos", value: mxn(ingresos), sub: `${nVentas} venta(s)`, color: "#3B2113" },
    { label: "Gestión (cacao)", value: `${data.gestionKg} kg`, sub: mxn(data.gestionMonto), color: "#4B6A4B" },
    { label: "Reinversión (bodega)", value: `${data.reinversionKg} kg`, sub: mxn(data.reinversionMonto), color: "#5B7A9E" },
    { label: "Nómina", value: mxn(data.saldoNomina), sub: "acumulado", color: "#8A6BAE" },
    { label: "Gastos Variables", value: mxn(data.saldoGastosVar), sub: `${mxn(gastos)} gastado en total`, color: "#B5763E" },
    { label: "Tu ganancia", value: mxn(data.saldoGanancia), sub: "libre, acumulada", color: "#C17A3D" },
  ];
  document.getElementById("summary").innerHTML = cards.map(c => `
    <div class="card">
      <div class="label" style="color:${c.color}">${c.label}</div>
      <div class="value">${c.value}</div>
      <div class="sub">${c.sub}</div>
    </div>`).join("");
}

function renderError() {
  const el = document.getElementById("errorBanner");
  el.innerHTML = error ? `<div class="error-banner">${error}</div>` : "";
}

function renderReparto() {
  document.getElementById("repartoHint").textContent =
    `Gestión a ${mxn(PRECIO_GESTION)}/kg y Reinversión a ${mxn(data.precioReinversion)}/kg, siempre redondeando hacia abajo: solo cuenta un kilo cuando el monto lo cubre completo.`;
  document.getElementById("precioReinversion").value = data.precioReinversion;

  const sliders = [
    { key: "gestion", label: "Gestión (materia prima cacao)", min: 10, max: 50, color: "#4B6A4B" },
    { key: "reinversion", label: "Reinversión (stock de bodega)", min: 5, max: 25, color: "#5B7A9E" },
    { key: "nomina", label: "Nómina", min: 5, max: 30, color: "#8A6BAE" },
    { key: "gastosVar", label: "Gastos Variables", min: 5, max: 25, color: "#B5763E" },
  ];
  document.getElementById("sliders").innerHTML = sliders.map(s => `
    <div class="slider-row">
      <div class="top"><span>${s.label}</span><span class="pct" style="color:${s.color}">${data.pct[s.key]}%</span></div>
      <input type="range" min="${s.min}" max="${s.max}" step="5" value="${data.pct[s.key]}" data-key="${s.key}" class="pct-slider" style="accent-color:${s.color}" />
    </div>`).join("");

  document.getElementById("pctGananciaLabel").textContent = pctGanancia() + "%";

  document.querySelectorAll(".pct-slider").forEach(sl => {
    sl.addEventListener("input", (e) => {
      const key = e.target.dataset.key;
      const value = parseInt(e.target.value);
      const next = { ...data.pct, [key]: value };
      const suma = next.gestion + next.reinversion + next.nomina + next.gastosVar;
      if (suma > 95) next[key] = value - (suma - 95);
      data.pct = next;
      save();
      renderReparto();
      renderVentaPreview();
    });
  });
}

function renderTabs() {
  document.getElementById("tabVentaBtn").classList.toggle("active", tab === "venta");
  document.getElementById("tabGastoBtn").classList.toggle("active", tab === "gasto");
  document.getElementById("ventaForm").style.display = tab === "venta" ? "block" : "none";
  document.getElementById("gastoForm").style.display = tab === "gasto" ? "block" : "none";
}

function renderVentaPreview() {
  const monto = parseFloat(document.getElementById("ventaMonto").value) || 0;
  const box = document.getElementById("ventaPreview");
  if (monto <= 0) { box.style.display = "none"; return; }
  const pg = pctGanancia();
  const mGestion = monto * (data.pct.gestion / 100);
  const mReinversion = monto * (data.pct.reinversion / 100);
  const mNomina = monto * (data.pct.nomina / 100);
  const mGastosVar = monto * (data.pct.gastosVar / 100);
  const mGanancia = monto * (pg / 100);
  const kgGestion = Math.floor(mGestion / PRECIO_GESTION);
  const kgReinversion = Math.floor(mReinversion / data.precioReinversion);
  const rows = [
    { l: `Gestión (${data.pct.gestion}%)`, v: `${kgGestion} kg · ${mxn(mGestion)}`, c: "#4B6A4B" },
    { l: `Reinversión (${data.pct.reinversion}%)`, v: `${kgReinversion} kg · ${mxn(mReinversion)}`, c: "#5B7A9E" },
    { l: `Nómina (${data.pct.nomina}%)`, v: mxn(mNomina), c: "#8A6BAE" },
    { l: `Gastos Var. (${data.pct.gastosVar}%)`, v: mxn(mGastosVar), c: "#B5763E" },
    { l: `Ganancia (${pg}%)`, v: mxn(mGanancia), c: "#C17A3D" },
  ];
  box.style.display = "grid";
  box.innerHTML = rows.map(r => `
    <div class="preview-row">
      <div class="plabel">${r.l}</div>
      <div class="pvalue" style="color:${r.c}">${r.v}</div>
    </div>`).join("");
}

function renderGastoCats() {
  document.getElementById("gastoCats").innerHTML = GASTO_CATS.map(c => `
    <button type="button" class="cat-btn ${c.id === gastoCategoria ? "active" : ""}" data-id="${c.id}">
      <span>${c.icon}</span>${c.label}
    </button>`).join("");
  document.querySelectorAll(".cat-btn").forEach(b => {
    b.addEventListener("click", () => {
      gastoCategoria = b.dataset.id;
      renderGastoCats();
      renderGastoInfo();
    });
  });
  renderGastoInfo();
}

function renderGastoInfo() {
  const cat = GASTO_CATS.find(c => c.id === gastoCategoria);
  const balance = bucketBalance(cat.bucket);
  const monto = parseFloat(document.getElementById("gastoMonto").value) || 0;
  const warn = monto > balance ? `<span class="warn"> — esto lo deja en negativo.</span>` : "";
  document.getElementById("gastoInfo").innerHTML =
    `Este gasto se descuenta de <strong>${cat.label}</strong>. Saldo actual: <strong>${mxn(balance)}</strong>${warn}`;
}

function renderHistory() {
  const list = document.getElementById("historyList");
  if (data.entries.length === 0) {
    list.innerHTML = `<div class="empty-hint">Aún no hay movimientos registrados.</div>`;
    return;
  }
  list.innerHTML = data.entries.map(e => {
    const isVenta = e.type === "venta";
    let detail;
    if (isVenta) {
      detail = `
        <span style="color:#4B6A4B">gestión +${e.kgGestionNuevos} kg (${mxn(e.montoGestion)})</span>
        <span style="color:#5B7A9E">reinversión +${e.kgReinversionNuevos} kg (${mxn(e.montoReinversion)})</span>
        <span style="color:#8A6BAE">nómina ${mxn(e.montoNomina)}</span>
        <span style="color:#B5763E">gastos var. ${mxn(e.montoGastosVar)}</span>
        <span style="color:#C17A3D">ganancia ${mxn(e.montoGanancia)}</span>`;
    } else {
      const catLabel = GASTO_CATS.find(c => c.id === e.categoria)?.label || "";
      const kgTxt = typeof e.kgOut === "number" ? ` · −${e.kgOut} kg` : "";
      detail = `<span>${catLabel}${kgTxt}</span>`;
    }
    return `
      <div class="hist-item">
        <div>
          <div class="top-row">
            <span class="date">${e.fecha}</span>
            <span class="amt" style="color:${isVenta ? "#4B6A4B" : "#B5763E"}">${isVenta ? "+" : "−"}${mxn(e.monto)}</span>
          </div>
          <div class="detail">${detail}</div>
        </div>
        <button class="del-btn" data-id="${e.id}">🗑</button>
      </div>`;
  }).join("");

  document.querySelectorAll(".del-btn").forEach(b => {
    b.addEventListener("click", () => handleDelete(b.dataset.id));
  });
}

function renderAll() {
  renderSummary();
  renderError();
  renderReparto();
  renderTabs();
  renderVentaPreview();
  renderGastoCats();
  renderHistory();
}

/* ---------- actions ---------- */

function handleAddVenta(ev) {
  ev.preventDefault();
  const monto = parseFloat(document.getElementById("ventaMonto").value) || 0;
  if (monto <= 0) { error = "Captura un monto de venta mayor a cero."; renderError(); return; }
  const fecha = document.getElementById("ventaFecha").value || todayStr();

  const pg = pctGanancia();
  const montoGestion = monto * (data.pct.gestion / 100);
  const montoReinversion = monto * (data.pct.reinversion / 100);
  const montoNomina = monto * (data.pct.nomina / 100);
  const montoGastosVar = monto * (data.pct.gastosVar / 100);
  const montoGanancia = monto * (pg / 100);
  const kgGestionNuevos = Math.floor(montoGestion / PRECIO_GESTION);
  const kgReinversionNuevos = Math.floor(montoReinversion / data.precioReinversion);

  const entry = {
    id: Date.now().toString(36), type: "venta", fecha, monto,
    montoGestion, montoReinversion, montoNomina, montoGastosVar, montoGanancia,
    kgGestionNuevos, kgReinversionNuevos,
  };

  data.entries.unshift(entry);
  data.gestionMonto += montoGestion; data.gestionKg += kgGestionNuevos;
  data.reinversionMonto += montoReinversion; data.reinversionKg += kgReinversionNuevos;
  data.saldoNomina += montoNomina; data.saldoGastosVar += montoGastosVar; data.saldoGanancia += montoGanancia;

  error = null;
  document.getElementById("ventaMonto").value = "";
  save();
  renderAll();
}

function handleAddGasto(ev) {
  ev.preventDefault();
  const monto = parseFloat(document.getElementById("gastoMonto").value) || 0;
  if (monto <= 0) { error = "Captura un monto de gasto mayor a cero."; renderError(); return; }
  const fecha = document.getElementById("gastoFecha").value || todayStr();
  const cat = GASTO_CATS.find(c => c.id === gastoCategoria);

  const entry = { id: Date.now().toString(36), type: "gasto", fecha, monto, categoria: gastoCategoria, bucket: cat.bucket };

  if (cat.bucket === "gastosVar") data.saldoGastosVar -= monto;
  else if (cat.bucket === "nomina") data.saldoNomina -= monto;
  else if (cat.bucket === "ganancia") data.saldoGanancia -= monto;
  else if (cat.bucket === "reinversion") {
    const kgOut = Math.floor(monto / data.precioReinversion);
    entry.kgOut = kgOut; entry.precioUsado = data.precioReinversion;
    data.reinversionMonto -= monto; data.reinversionKg -= kgOut;
  } else if (cat.bucket === "gestion") {
    const kgOut = Math.floor(monto / PRECIO_GESTION);
    entry.kgOut = kgOut; entry.precioUsado = PRECIO_GESTION;
    data.gestionMonto -= monto; data.gestionKg -= kgOut;
  }

  data.entries.unshift(entry);
  error = null;
  document.getElementById("gastoMonto").value = "";
  save();
  renderAll();
}

function handleDelete(id) {
  const entry = data.entries.find(e => e.id === id);
  if (!entry) return;
  data.entries = data.entries.filter(e => e.id !== id);
  if (entry.type === "gasto") {
    if (entry.bucket === "gastosVar") data.saldoGastosVar += entry.monto;
    else if (entry.bucket === "nomina") data.saldoNomina += entry.monto;
    else if (entry.bucket === "ganancia") data.saldoGanancia += entry.monto;
    else if (entry.bucket === "reinversion") { data.reinversionMonto += entry.monto; data.reinversionKg += entry.kgOut || 0; }
    else if (entry.bucket === "gestion") { data.gestionMonto += entry.monto; data.gestionKg += entry.kgOut || 0; }
  } else {
    data.gestionMonto -= entry.montoGestion; data.gestionKg -= entry.kgGestionNuevos;
    data.reinversionMonto -= entry.montoReinversion; data.reinversionKg -= entry.kgReinversionNuevos;
    data.saldoNomina -= entry.montoNomina; data.saldoGastosVar -= entry.montoGastosVar; data.saldoGanancia -= entry.montoGanancia;
  }
  save();
  renderAll();
}

/* ---------- wire up ---------- */

document.getElementById("ventaFecha").value = todayStr();
document.getElementById("gastoFecha").value = todayStr();

document.getElementById("tabVentaBtn").addEventListener("click", () => { tab = "venta"; renderTabs(); });
document.getElementById("tabGastoBtn").addEventListener("click", () => { tab = "gasto"; renderTabs(); });
document.getElementById("gearBtn").addEventListener("click", () => {
  const box = document.getElementById("ajustesBox");
  box.style.display = box.style.display === "none" ? "block" : "none";
});
document.getElementById("precioReinversion").addEventListener("change", (e) => {
  data.precioReinversion = parseFloat(e.target.value) || 1;
  save();
  renderReparto();
  renderVentaPreview();
});
document.getElementById("ventaForm").addEventListener("submit", handleAddVenta);
document.getElementById("gastoForm").addEventListener("submit", handleAddGasto);
document.getElementById("ventaMonto").addEventListener("input", renderVentaPreview);
document.getElementById("gastoMonto").addEventListener("input", renderGastoInfo);

/* ---------- lock screen ---------- */
const ACCESS_CODE = "1590"; // cámbialo aquí por el código que quieras

function unlockApp() {
  document.getElementById("lockScreen").style.display = "none";
  document.getElementById("appWrap").style.display = "block";
  renderAll();
}

try {
  if (localStorage.getItem("matru-unlocked") === "yes") {
    unlockApp();
  }
} catch (e) {}

document.getElementById("lockBtn").addEventListener("click", tryUnlock);
document.getElementById("lockInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") tryUnlock();
});

function tryUnlock() {
  const val = document.getElementById("lockInput").value;
  if (val === ACCESS_CODE) {
    try {
      localStorage.setItem("matru-unlocked", "yes");
    } catch (e) {}
    unlockApp();
  } else {
    document.getElementById("lockError").textContent = "Código incorrecto";
    document.getElementById("lockInput").value = "";
  }
}
</script>
</body>
</html>
